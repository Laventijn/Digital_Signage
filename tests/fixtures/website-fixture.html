<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Website fixture</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; font-family: Arial, sans-serif; background: #f7f7f7; color: #111; }
    main { display: grid; place-items: center; width: 100vw; height: 100vh; }
    strong { font-size: 7vw; }
  </style>
</head>
<body>
  <main>
    <strong id="value">Dashboardwaarde 1</strong>
  </main>
  <script>
    window.setTimeout(() => {
      document.getElementById('value').textContent = 'Dashboardwaarde stabiel';
    }, 500);
  </script>
</body>
</html>
